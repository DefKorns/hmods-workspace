name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  hmod:
    # Keep in sync with the hmod-build submodule commit.
    uses: DefKorns/hmod-build/.github/workflows/hmod.yml@@HMOD_BUILD_SHA@
    with:
      release-name: @NAME@
      docker: @DOCKER@
    secrets: inherit
    permissions:
      contents: write
