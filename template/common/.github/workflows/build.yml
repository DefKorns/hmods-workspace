name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  hmod:
    # Keep in sync with the vendor/hmod-build submodule tag.
    uses: DefKorns/hmod-build/.github/workflows/hmod.yml@@HMOD_BUILD_REF@
    with:
      release-name: @NAME@
      docker: @DOCKER@
    secrets: inherit
    permissions:
      contents: write
